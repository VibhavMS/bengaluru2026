<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Humans of USMLE - Bengaluru 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Webix Library -->
    <link rel="stylesheet" href="https://cdn.webix.com/edge/webix.css" type="text/css">
    <script src="https://cdn.webix.com/edge/webix.js" type="text/javascript"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: Roboto, sans-serif; }
    </style>
</head>
<body>
    <script type="text/javascript">
    webix.ready(function(){

      // 1. YOUR LIVE DATABASE LINK
      var googleUrl = "https://script.google.com/macros/s/AKfycbzUvaX3GP6Q_w6rTxHGSG0dehxc1QFjM0EIusZdD8Poy77gUXox-jTwCD2oYasAbwWEhg/exec"; 
      var maxCapacity = 10;

      // --- 2. THE POP-UP REGISTRATION FORM ---
      var bookingWindow = {
        view: "window", id: "win_reg", head: "Confirm Selection",
        modal: true, position: "center", width: 450,
        body: {
          view: "form", id: "form_reg",
          elements: [
            { view: "template", id: "selected_info", template: "<strong>Workshop:</strong> #title#<br><strong>Time:</strong> #time#", autoheight: true },
            { view: "text", label: "Full Name", name: "name", required: true, placeholder: "As per ID" },
            { view: "text", label: "Email", name: "email", required: true, placeholder: "yourname@email.com" },
            { 
              view: "button", label: "Confirm My Slot", css: "webix_primary", height: 50,
              click: function(){
                if($$("form_reg").validate()){
                  var formData = $$("form_reg").getValues();
                  var slotData = $$("selected_info").getValues();
                  var payload = { name: formData.name, email: formData.email, title: slotData.title, time: slotData.time };
                  webix.message("Syncing with Google Sheets...");
                  webix.ajax().post(googleUrl, JSON.stringify(payload), function(text){
                     webix.alert({
                       title: "Success!",
                       text: "Your slot is booked. The capacity will update shortly!",
                       callback: function() {
                         $$("win_reg").hide();
                         $$("form_reg").clear();
                         loadLiveSlots(); 
                       }
                     });
                  });
                }
              }
            },
            { view: "button", label: "Cancel", click: () => $$("win_reg").hide() }
          ]
        }
      };

      // --- 3. THE LIVE SYNC LOGIC ---
      function loadLiveSlots() {
        if ($$("slot_table")) $$("slot_table").showProgress();
        webix.ajax().get(googleUrl, function(text){
          var counts = JSON.parse(text);
          var workshops = ["📘 Step 1 Prep", "🧠 Research Simplified", "📝 CV Building", "📄 US Electives"];
          var times = [{ start: 10, end: 13 }, { start: 14, end: 16 }];
          var finalData = [];
          workshops.forEach(w => {
            times.forEach(t => {
              for (var h = t.start; h < t.end; h++) {
                for (var m = 0; m < 60; m += 20) {
                  var displayH = h > 12 ? h - 12 : h;
                  var timeStr = displayH + ":" + (m === 0 ? "00" : m) + (h >= 12 ? " PM" : " AM");
                  var key = w + "|" + timeStr;
                  var booked = counts[key] || 0;
                  var remaining = maxCapacity - booked;
                  finalData.push({ title: w, time: timeStr, spots: remaining > 0 ? remaining : 0, status: remaining > 0 ? remaining + " spots left" : "FULL", canBook: remaining > 0 });
                }
              }
            });
          });
          $$("slot_table").clearAll();
          $$("slot_table").parse(finalData);
          $$("slot_table").hideProgress();
        });
      }

      // --- 4. MAIN INTERFACE ---
      webix.ui({
        rows: [
          { view: "toolbar", css: "webix_dark", height: 60, elements: [ { view: "label", label: "✨ HUMANS OF USMLE", labelWidth: 200 }, {}, { view: "button", label: "Home", width: 80, click: () => $$("page_home").show() }, { view: "button", label: "Booking", width: 100, click: () => $$("page_booking").show() } ] },
          {
            view: "multiview", id: "main_view",
            cells: [
              { id: "page_home", view: "scrollview", body: { rows: [ { view: "template", autoheight: true, template: '<div style="text-align:center; padding: 50px 20px;"><h1 style="color: #1a2a6c; font-size: 32px;">Humans of USMLE - Bengaluru 2026</h1><h2 style="color: #d32f2f;">MAY 23rd & 24th</h2><p style="font-size: 16px; color: #555;">Live Mentoring Slot Booking</p></div>' }, { padding: 30, rows: [ { view: "template", autoheight: true, template: '<div style="text-align:center; padding: 25px; background: #fffde7; border: 2px dashed #fbc02d; border-radius: 12px; margin-bottom: 30px;"><h3 style="margin-top:0; color: #7f0000;">⚠️ Step 1: Event Registration</h3><p>You must register for the main event to attend these workshops:</p><a href="https://superprofile.bio/e/bengaluru2026" target="_blank" style="background: #1a2a6c; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">Register for Bengaluru 2026 Here</a></div>' }, { view: "button", value: "Step 2: View Live Available Slots", css: "webix_primary", height: 70, click: function() { $$("page_booking").show(); } } ] } ] } },
              { id: "page_booking", rows: [ { view: "toolbar", height: 50, css: "webix_header", elements: [ { view: "label", label: "🗓️ Live Workshop Availability", align: "center" } ] }, { view: "datatable", id: "slot_table", columns: [ { id: "title", header: ["Workshop", {content:"selectFilter"}], fillspace: true }, { id: "time", header: "Time Slot", width: 130 }, { id: "status", header: "Availability", width: 140 }, { id: "action", header: "Action", width: 100, template: function(obj){ return obj.canBook ? "<button class='book_btn' style='cursor:pointer; background:#1776BF; color:white; border:none; border-radius:3px; width:100%; height:30px;'>Book</button>" : "<span style='color:red; font-weight:bold;'>FULL</span>"; } } ], onClick: { "book_btn": function(ev, id) { var item = this.getItem(id); webix.ui(bookingWindow).show(); $$("selected_info").setValues(item); } } } ] }
            ]
          }
        ]
      });

      webix.extend($$("slot_table"), webix.ProgressBar);
      loadLiveSlots();
    });
    </script>
</body>
</html>
