<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Humans of USMLE - Bengaluru 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="stylesheet" href="https://cdn.webix.com/edge/webix.css" type="text/css">
    <script src="https://cdn.webix.com/edge/webix.js" type="text/javascript"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }
        .hero-section { text-align: center; padding: 50px 20px; background: #fdfdfd; }
        .hero-h1 { color: #1a2a6c; font-size: 32px; margin-bottom: 5px; }
        .hero-date { color: #d32f2f; font-weight: bold; font-size: 22px; margin-bottom: 20px; }
        .reg-box { 
            max-width: 500px; margin: 0 auto; padding: 20px; 
            background: #fffde7; border: 2px dashed #fbc02d; border-radius: 12px; 
        }
    </style>
</head>
<body>
    <script type="text/javascript">
    webix.ready(function(){

      var googleUrl = "https://script.google.com/macros/s/AKfycbwm6Yko-pvJYxvj0X4B1iFg03nAC_bOziwkGnBjqkAhAwpeMFAsZy0dbiLya1p3mlzAlg/exec"; 

      // --- 1. REGISTRATION FORM ---
      var bookingWindow = {
        view: "window", id: "win_reg", head: "Confirm Selection",
        modal: true, position: "center", width: 400,
        body: {
          view: "form", id: "form_reg",
          elements: [
            { view: "template", id: "selected_info", template: "<strong>#day#</strong><br><strong>Workshop:</strong> #title#<br><strong>Time:</strong> #time#", autoheight: true },
            { view: "text", label: "Name", name: "name", required: true },
            { view: "text", label: "Email", name: "email", required: true },
            { 
              view: "button", label: "Submit Registration", css: "webix_primary", height: 50,
              click: function(){
                if($$("form_reg").validate()){
                  var vals = $$("form_reg").getValues();
                  var info = $$("selected_info").getValues();
                  webix.message("Submitting...");
                  webix.ajax().post(googleUrl, JSON.stringify({
                    name: vals.name, email: vals.email, title: info.title, time: info.time, day: info.day
                  }), function(){
                    webix.alert("Submission Received! Slots are allocated on a first-come, first-served basis.", function(){
                      $$("win_reg").hide();
                    });
                  });
                }
              }
            },
            { view: "button", label: "Cancel", click: () => $$("win_reg").hide() }
          ]
        }
      };

      // --- 2. DATA GENERATION FOR DAY 1 & DAY 2 ---
      function getDayData(dayLabel) {
        var workshops = ["Step 1 Prep", "Research Simplified", "CV Building", "US Electives"];
        var shifts = [{ start: 10, end: 13 }, { start: 14, end: 16 }];
        var data = [];
        
        workshops.forEach(w => {
          shifts.forEach(shift => {
            for (var h = shift.start; h < shift.end; h++) {
              for (var m = 0; m < 60; m += 20) {
                var displayH = h > 12 ? h - 12 : h;
                var ampm = h >= 12 ? " PM" : " AM";
                var timeStr = displayH + ":" + (m === 0 ? "00" : m) + ampm;
                data.push({ day: dayLabel, title: w, time: timeStr });
              }
            }
          });
        });
        return data;
      }

      // --- 3. MAIN UI ---
      webix.ui({
        rows: [
          { 
            view: "toolbar", css: "webix_dark", height: 60, 
            elements: [
              { view: "label", label: "HUMANS OF USMLE", width: 200 },
              {},
              { view: "button", label: "Home", width: 90, click: () => $$("page_home").show() },
              { view: "button", label: "Booking", width: 90, click: () => $$("page_booking").show() }
            ] 
          },
          {
            view: "multiview", id: "main_view",
            cells: [
              // HOME PAGE
              {
                id: "page_home",
                rows: [
                  {
                    view: "template", scroll: "y", template: `
                      <div class="hero-section">
                        <h1 class="hero-h1">Humans of USMLE - Bengaluru</h1>
                        <p class="hero-date">MAY 23rd (Day 1) & 24th (Day 2)</p>
                        <div class="reg-box">
                          <h3>First-Come, First-Served Mentoring</h3>
                          <p>Select your preferred day and workshop slot. We will allocate based on submission order.</p>
                          <a href="https://superprofile.bio/e/bengaluru2026" target="_blank" style="display:inline-block; margin-top:10px; padding:10px 20px; background:#1a2a6c; color:white; text-decoration:none; border-radius:5px;">Event Registration Link</a>
                        </div>
                      </div>
                    `
                  },
                  { padding: 20, cols: [{}, { view: "button", value: "Go to Booking", css: "webix_primary", height: 55, width: 250, click: () => $$("page_booking").show() }, {}] }
                ]
              },
              // BOOKING PAGE
              {
                id: "page_booking",
                rows: [
                  {
                    view: "tabbar", id: "day_tabbar", multiview: true, options: [
                      { id: "tab_day1", value: "Day 1 (May 23)" },
                      { id: "tab_day2", value: "Day 2 (May 24)" }
                    ]
                  },
                  {
                    cells: [
                      {
                        id: "tab_day1",
                        view: "datatable", select: "row",
                        columns: [
                          { id: "title", header: ["Workshop", {content:"selectFilter"}], fillspace: true },
                          { id: "time", header: "Time", width: 120 },
                          { id: "action", header: "Register", width: 110, template: "<button class='book_btn' style='cursor:pointer; background:#1776BF; color:white; border:none; width:100%; border-radius:3px;'>Register</button>" }
                        ],
                        data: getDayData("Day 1 (May 23)"),
                        onClick: { "book_btn": function(ev, id) { 
                          var item = this.getItem(id); 
                          if (!$$("win_reg")) webix.ui(bookingWindow);
                          $$("win_reg").show(); 
                          $$("selected_info").setValues(item); 
                        }}
                      },
                      {
                        id: "tab_day2",
                        view: "datatable", select: "row",
                        columns: [
                          { id: "title", header: ["Workshop", {content:"selectFilter"}], fillspace: true },
                          { id: "time", header: "Time", width: 120 },
                          { id: "action", header: "Register", width: 110, template: "<button class='book_btn' style='cursor:pointer; background:#1776BF; color:white; border:none; width:100%; border-radius:3px;'>Register</button>" }
                        ],
                        data: getDayData("Day 2 (May 24)"),
                        onClick: { "book_btn": function(ev, id) { 
                          var item = this.getItem(id); 
                          if (!$$("win_reg")) webix.ui(bookingWindow);
                          $$("win_reg").show(); 
                          $$("selected_info").setValues(item); 
                        }}
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      });
    });
    </script>
</body>
</html>
