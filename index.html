<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Humans of USMLE - Bengaluru 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="stylesheet" href="https://cdn.webix.com/edge/webix.css" type="text/css">
    <script src="https://cdn.webix.com/edge/webix.js" type="text/javascript"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section { text-align: center; padding: 60px 20px; background: #f8f9fa; }
        .hero-h1 { color: #1a2a6c; font-size: 34px; margin-bottom: 10px; }
        .hero-date { color: #d32f2f; font-weight: bold; font-size: 20px; margin-bottom: 20px; }
        .reg-box { 
            max-width: 500px; margin: 0 auto; padding: 25px; 
            background: #fffde7; border: 2px dashed #fbc02d; border-radius: 12px; 
        }
    </style>
</head>
<body>
    <script type="text/javascript">
    webix.ready(function(){

      // YOUR GOOGLE DEPLOYMENT LINK
      var googleUrl = "https://script.google.com/macros/s/AKfycbwm6Yko-pvJYxvj0X4B1iFg03nAC_bOziwkGnBjqkAhAwpeMFAsZy0dbiLya1p3mlzAlg/exec"; 

      // --- 1. REGISTRATION WINDOW ---
      var bookingWindow = {
        view: "window", id: "win_reg", head: "Slot Confirmation",
        modal: true, position: "center", width: 400,
        body: {
          view: "form", id: "form_reg",
          elements: [
            { view: "template", id: "selected_info", template: "<strong>Workshop:</strong> #title#<br><strong>Time:</strong> #time#", autoheight: true },
            { view: "text", label: "Full Name", name: "name", required: true },
            { view: "text", label: "Email", name: "email", required: true },
            { 
              view: "button", label: "Submit Registration", css: "webix_primary", height: 50,
              click: function(){
                if($$("form_reg").validate()){
                  var vals = $$("form_reg").getValues();
                  var info = $$("selected_info").getValues();
                  webix.message("Sending...");
                  webix.ajax().post(googleUrl, JSON.stringify({
                    name: vals.name, email: vals.email, title: info.title, time: info.time
                  }), function(){
                    webix.alert("Submission Received! We will finalize slots on a first-come, first-served basis.", function(){
                      $$("win_reg").hide();
                    });
                  });
                }
              }
            },
            { view: "button", label: "Close", click: () => $$("win_reg").hide() }
          ]
        }
      };

      // --- 2. STATIC SLOT GENERATION ---
      function getStaticData() {
        var workshops = ["Step 1 Prep", "Research Simplified", "CV Building", "US Electives"];
        var shifts = [
          { start: 10, end: 13 }, // 10 AM to 1 PM
          { start: 14, end: 16 }  // 2 PM to 4 PM
        ];
        var finalData = [];
        
        workshops.forEach(w => {
          shifts.forEach(shift => {
            for (var h = shift.start; h < shift.end; h++) {
              for (var m = 0; m < 60; m += 20) {
                var displayH = h > 12 ? h - 12 : h;
                var ampm = h >= 12 ? " PM" : " AM";
                var timeStr = displayH + ":" + (m === 0 ? "00" : m) + ampm;
                
                finalData.push({ 
                  title: w, 
                  time: timeStr, 
                  status: "Available"
                });
              }
            }
          });
        });
        return finalData;
      }

      // --- 3. MAIN UI STRUCTURE ---
      webix.ui({
        rows: [
          { 
            view: "toolbar", css: "webix_dark", height: 60, 
            elements: [
              { view: "label", label: "HUMANS OF USMLE", width: 200 },
              {},
              { view: "button", label: "Home", width: 100, click: () => $$("page_home").show() },
              { view: "button", label: "Booking", width: 100, click: () => $$("page_booking").show() }
            ] 
          },
          {
            view: "multiview", id: "main_view",
            cells: [
              {
                id: "page_home",
                rows: [
                  {
                    view: "template", scroll: "y", template: `
                      <div class="hero-section">
                        <h1 class="hero-h1">Humans of USMLE - Bengaluru 2026</h1>
                        <p class="hero-date">MAY 23rd & 24th</p>
                        <div class="reg-box">
                          <h3>First-Come, First-Served Mentoring</h3>
                          <p>Register your interest for specific workshop slots below. Final slots will be allocated based on the order of submission.</p>
                          <a href="https://superprofile.bio/e/bengaluru2026" target="_blank" style="display:inline-block; padding:10px 20px; background:#1a2a6c; color:white; text-decoration:none; border-radius:5px;">Main Event Registration</a>
                        </div>
                      </div>
                    `
                  },
                  { padding: 20, cols: [{}, { view: "button", value: "Go to Booking", css: "webix_primary", height: 50, width: 300, click: () => $$("page_booking").show() }, {}] }
                ]
              },
              {
                id: "page_booking",
                rows: [
                  { view: "toolbar", elements: [{ view: "label", label: "Select Your Preferred Time Slot" }] },
                  {
                    view: "datatable", id: "slot_table",
                    columns: [
                      { id: "title", header: ["Workshop", {content:"selectFilter"}], fillspace: true },
                      { id: "time", header: "Time Slot", width: 140 },
                      { id: "action", header: "Register", width: 120, template: "<button class='webix_button' style='cursor:pointer; background:#1776BF; color:white; border:none; border-radius:3px;'>Register</button>" }
                    ],
                    data: getStaticData(),
                    onClick: {
                      "webix_button": function(ev, id) {
                        var item = this.getItem(id);
                        if (!$$("win_reg")) webix.ui(bookingWindow);
                        $$("win_reg").show();
                        $$("selected_info").setValues(item);
                      }
                    }
                  }
                ]
              }
            ]
          }
        ]
      });
    });
    </script>
</body>
</html>
